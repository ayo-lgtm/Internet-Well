name: Verify productization

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  productization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile CLI and engine
        run: python3 -m py_compile internet_well.py automation/founder_os_engine.py
      - name: Build package
        run: |
          python3 -m pip install --upgrade pip build
          python3 -m build
      - name: Install package
        run: python3 -m pip install dist/*.whl
      - name: Verify version
        run: |
          internet-well --version | grep -q '0.3.0'
          test "$(cat VERSION)" = "0.3.0"
          grep -q 'version = "0.3.0"' pyproject.toml
      - name: Exercise JSON assessment
        run: internet-well assess . --format json > /tmp/internet-well-assess.json
      - name: Exercise Markdown plan
        run: internet-well plan . --goal 'launch founder operating system' --format markdown > /tmp/internet-well-plan.md
      - name: Exercise security review
        run: internet-well security . --format json > /tmp/internet-well-security.json
      - name: Exercise launch review
        run: internet-well launch-review . --format markdown > /tmp/internet-well-launch.md
      - name: Exercise consented CodeWiki manifest
        run: internet-well docs . --provider codewiki --provider-consent --format json > /tmp/internet-well-docs.json
      - name: Validate productization artifacts
        run: |
          test -s /tmp/internet-well-assess.json
          test -s /tmp/internet-well-plan.md
          test -s /tmp/internet-well-security.json
          test -s /tmp/internet-well-launch.md
          test -s /tmp/internet-well-docs.json
          grep -q 'Internet-Well Preliminary Implementation Plan' /tmp/internet-well-plan.md
          grep -q 'Preliminary static assessment only' /tmp/internet-well-launch.md
          grep -q '"provider": "codewiki"' /tmp/internet-well-docs.json
          grep -q '"provider_consent_recorded": true' /tmp/internet-well-docs.json
          grep -q '"report_classification": "private"' /tmp/internet-well-assess.json
          test -f docs/CODEWIKI-INTEGRATION.md
          test -f docs/PRIVACY-AND-DATA-HANDLING.md
          test -f SECURITY.md
          test -f governance/HUMAN-REVIEW.md
          test -f governance/RELEASES.md
          test -f examples/assessment-example.md
          test ! -d assessments
