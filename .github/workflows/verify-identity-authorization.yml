name: Verify identity and authorization

on:
  pull_request:
  push:
    branches:
      - agent/founder-os-v2

permissions:
  contents: read

jobs:
  evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate identity and authorization evidence
        run: python3 automation/verify_identity_authorization_bundle.py
