name: Verify registry

on:
  push:
    paths: ["registry/**", "automation/**", "schemas/**"]
  pull_request:
    paths: ["registry/**", "automation/**", "schemas/**"]
  schedule:
    # Weekly staleness sweep (Mondays 06:00 UTC). Entries older than the
    # 90-day re-verification window fail the run, implementing the
    # continuous-verification loop in PHASES.md.
    - cron: "0 6 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint registry consistency, tier rules, and staleness
        run: python3 automation/verify_registry.py --max-age 90
      - name: Check INDEX.md is regenerated
        run: python3 automation/build_index.py --check
