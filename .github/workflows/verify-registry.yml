name: Verify registry

on:
  push:
    paths: ["registry/**", "tools/**"]
  pull_request:
    paths: ["registry/**", "tools/**"]
  schedule:
    # Weekly staleness sweep (Mondays 06:00 UTC). Entries older than the
    # 90-day re-verification window fail the run, implementing the
    # Phase 4 loop in PHASES.md.
    - cron: "0 6 * * 1"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint registry consistency and staleness
        run: python3 tools/verify_registry.py --max-age 90
