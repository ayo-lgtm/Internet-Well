name: Verify Internet-Well

on:
  push:
    paths:
      - "registry/**"
      - "catalog/**"
      - "automation/**"
      - "schemas/**"
      - "commands/**"
      - "playbooks/**"
      - "capabilities/**"
      - "profiles/**"
      - "stacks/**"
      - "bundles/**"
      - "skills/**"
      - "outputs/**"
      - "evaluations/**"
      - "connections/**"
      - "AGENTS.md"
      - "START-HERE.md"
      - "FOUNDER-OS.md"
      - "README.md"
  pull_request:
    paths:
      - "registry/**"
      - "catalog/**"
      - "automation/**"
      - "schemas/**"
      - "commands/**"
      - "playbooks/**"
      - "capabilities/**"
      - "profiles/**"
      - "stacks/**"
      - "bundles/**"
      - "skills/**"
      - "outputs/**"
      - "evaluations/**"
      - "connections/**"
      - "AGENTS.md"
      - "START-HERE.md"
      - "FOUNDER-OS.md"
      - "README.md"
  schedule:
    - cron: "0 6 * * 1"

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate registry consistency, tier rules, and staleness
        run: python3 automation/verify_registry.py --max-age 90
      - name: Check generated registry index
        run: python3 automation/build_index.py --check
      - name: Validate Founder OS structure and safety gates
        run: python3 automation/verify_founder_os.py
      - name: Compile Python validators and engine
        run: python3 -m py_compile automation/*.py
      - name: Run Founder OS engine regression tests
        run: python3 -m unittest discover -s automation/tests -p 'test_*.py' -v
