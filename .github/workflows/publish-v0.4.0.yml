name: Publish v0.4.0

on:
  push:
    branches: [main]
    paths:
      - '.github/release-request-v0.4.0'
      - '.github/workflows/publish-v0.4.0.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify v0.4.0 version alignment
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          test "$VERSION" = "0.4.0"
          grep -q 'version = "0.4.0"' pyproject.toml
          grep -q 'VERSION = "0.4.0"' internet_well.py
          python3 - <<'PY'
          import json
          graph=json.load(open('integrations/agent-brain/capability-graph.json'))
          bundles=json.load(open('bundles/agent-brain-bundles.json'))
          assert graph['version'] == '0.4.0'
          assert bundles['version'] == '0.4.0'
          PY
          test -f docs/RELEASE-v0.4.0.md

      - name: Run complete release verification
        run: |
          set -euo pipefail
          python3 -m py_compile internet_well.py automation/*.py automation/tests/*.py tests/*.py
          python3 automation/verify_registry.py --max-age 90
          python3 automation/build_index.py --check
          python3 automation/verify_founder_os.py
          python3 automation/verify_public_repo_hygiene.py
          python3 automation/verify_identity_authorization_bundle.py
          python3 automation/verify_vibe_coder_catalog.py
          python3 automation/verify_agent_system_integrations.py
          python3 automation/report_verification_coverage.py --check --output /tmp/catalog-coverage.json
          python3 -m unittest discover -s automation/tests -p 'test_*.py' -v
          python3 -m unittest tests.test_agent_brain -v
          python3 automation/test_vibe_integrations.py
          python3 automation/test_ponytail_integration.py
          python3 automation/test_screenshot_integrations.py

      - name: Run Agent Brain evaluation lab
        run: |
          set -euo pipefail
          python3 -m pip install .
          internet-well-brain evaluate > /tmp/agent-brain-evaluation.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/agent-brain-evaluation.json'))
          assert data['passed'], json.dumps(data, indent=2)
          assert len(data['bundles']) >= 9
          PY
          internet-well-brain list-tools > /tmp/agent-brain-tools.json
          python3 - <<'PY'
          import json
          tools=json.load(open('/tmp/agent-brain-tools.json'))
          names={t['name'] for t in tools}
          required={'find_capability','recommend_stack','find_api','get_skill','plan_implementation','evaluate_bundle'}
          assert required <= names
          PY

      - name: Build distributions
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip build
          rm -rf dist build *.egg-info
          python3 -m build

      - name: Smoke-test wheel
        run: |
          set -euo pipefail
          python3 -m venv /tmp/internet-well-v040
          /tmp/internet-well-v040/bin/pip install dist/*.whl
          /tmp/internet-well-v040/bin/internet-well --version | grep -F '0.4.0'
          /tmp/internet-well-v040/bin/internet-well-integrations list >/tmp/integrations.json
          /tmp/internet-well-v040/bin/internet-well-agent-systems list >/tmp/agent-systems.json
          /tmp/internet-well-v040/bin/internet-well-brain list-tools >/tmp/brain-tools.json
          /tmp/internet-well-v040/bin/internet-well-brain evaluate >/tmp/brain-evaluation.json
          test -s /tmp/integrations.json
          test -s /tmp/agent-systems.json
          test -s /tmp/brain-tools.json
          test -s /tmp/brain-evaluation.json

      - name: Verify or create immutable v0.4.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.4.0 >/dev/null 2>&1; then
            git fetch --force origin refs/tags/v0.4.0:refs/tags/v0.4.0
            TAG_COMMIT="$(git rev-parse 'v0.4.0^{}')"
            git show "$TAG_COMMIT:VERSION" | tr -d '[:space:]' | grep -Fx '0.4.0'
            git show "$TAG_COMMIT:pyproject.toml" | grep -q 'version = "0.4.0"'
            git show "$TAG_COMMIT:internet_well.py" | grep -q 'VERSION = "0.4.0"'
            echo "Existing immutable v0.4.0 tag verified at $TAG_COMMIT"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a v0.4.0 "$GITHUB_SHA" -m 'Internet-Well v0.4.0 — Agent Brain'
            git push origin refs/tags/v0.4.0
          fi

      - name: Publish or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.4.0 >/dev/null 2>&1; then
            gh release upload v0.4.0 dist/* --clobber
            gh release edit v0.4.0 \
              --title 'Internet-Well v0.4.0 — Agent Brain' \
              --notes-file docs/RELEASE-v0.4.0.md
          else
            gh release create v0.4.0 dist/* \
              --verify-tag \
              --title 'Internet-Well v0.4.0 — Agent Brain' \
              --notes-file docs/RELEASE-v0.4.0.md
          fi
