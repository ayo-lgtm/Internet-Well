name: Publish v0.5.0

on:
  push:
    branches: [main]
    paths:
      - '.github/release-request-v0.5.0'
      - '.github/workflows/publish-v0.5.0.yml'

permissions:
  contents: write

jobs:
  publish-v050:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify v0.5.0 version alignment
        run: |
          set -euo pipefail
          test "$(tr -d '[:space:]' < VERSION)" = "0.5.0"
          grep -q 'version = "0.5.0"' pyproject.toml
          grep -q 'VERSION = "0.5.0"' internet_well.py
          python3 - <<'PY'
          import json
          graph=json.load(open('integrations/agent-brain/capability-graph.json'))
          bundles=json.load(open('bundles/agent-brain-bundles.json'))
          mcp=json.load(open('integrations/agent-brain/mcp.json'))
          assert graph['version'] == bundles['version'] == mcp['version'] == '0.5.0'
          PY
          test -f docs/RELEASE-v0.5.0.md
          test -f LICENSE-CONTENT
          test -f LICENSES.md

      - name: Run complete release verification
        run: |
          set -euo pipefail
          python3 -m py_compile internet_well.py automation/*.py automation/tests/*.py tests/*.py
          python3 automation/verify_registry.py --max-age 90
          python3 automation/build_index.py --check
          python3 automation/verify_founder_os.py
          python3 automation/verify_public_repo_hygiene.py
          python3 automation/verify_git_history_hygiene.py
          python3 automation/verify_identity_authorization_bundle.py
          python3 automation/verify_vibe_coder_catalog.py
          python3 automation/verify_agent_system_integrations.py
          python3 automation/report_verification_coverage.py --check --output /tmp/catalog-coverage.json
          python3 -m unittest discover -s automation/tests -p 'test_*.py' -v
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          python3 automation/test_vibe_integrations.py
          python3 automation/test_ponytail_integration.py
          python3 automation/test_screenshot_integrations.py

      - name: Run Agent Brain evaluation lab
        run: |
          set -euo pipefail
          python3 -m pip install .
          internet-well-brain evaluate > /tmp/agent-brain-evaluation.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/agent-brain-evaluation.json'))
          assert data['passed'], json.dumps(data, indent=2)
          assert len(data['bundles']) >= 10
          PY

      - name: Build distributions
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip build
          rm -rf dist build *.egg-info
          python3 -m build

      - name: Smoke-test wheel and license files
        run: |
          set -euo pipefail
          python3 -m venv /tmp/internet-well-v050
          /tmp/internet-well-v050/bin/pip install dist/*.whl
          /tmp/internet-well-v050/bin/internet-well --version | grep -F '0.5.0'
          /tmp/internet-well-v050/bin/internet-well-integrations list >/tmp/integrations.json
          /tmp/internet-well-v050/bin/internet-well-agent-systems list >/tmp/agent-systems.json
          /tmp/internet-well-v050/bin/internet-well-brain evaluate >/tmp/brain-evaluation.json
          unzip -l dist/*.whl | grep -F 'LICENSE-CONTENT'
          unzip -l dist/*.whl | grep -F 'licenses/LICENSE'
          unzip -l dist/*.whl | grep -F 'LICENSES.md'
          test -s /tmp/integrations.json
          test -s /tmp/agent-systems.json
          test -s /tmp/brain-evaluation.json

      - name: Create immutable v0.5.0 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin refs/tags/v0.5.0 >/dev/null 2>&1; then
            echo 'Refusing to replace existing immutable v0.5.0 tag.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v0.5.0 "$GITHUB_SHA" -m 'Internet-Well v0.5.0 — Reliable Execution and Product Systems'
          git push origin refs/tags/v0.5.0

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.5.0 dist/* \
            --verify-tag \
            --title 'Internet-Well v0.5.0 — Reliable Execution and Product Systems' \
            --notes-file docs/RELEASE-v0.5.0.md
