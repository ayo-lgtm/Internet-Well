name: Verify structured knowledge discovery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate registry and tests
        run: |
          python3 -m unittest tests.test_knowledge_discovery -v
      - name: Verify packaged CLI
        run: |
          python3 -m pip install .
          internet-well-knowledge sources > /tmp/sources.json
          internet-well-knowledge plan 'self-hosted open source analytics alternative' > /tmp/plan.json
          python3 - <<'PY'
          import json
          sources=json.load(open('/tmp/sources.json'))
          plan=json.load(open('/tmp/plan.json'))
          assert len(sources['sources']) == 10
          ids={x['id'] for x in sources['sources']}
          assert {'free-for-dev','awesome-mcp-servers','awesome-llm-apps','ollama','scrapling','open-design'} <= ids
          assert plan['sources'][0]['source'] == 'awesome-selfhosted'
          assert plan['execution'] == 'not-performed'
          PY
      - name: Enforce safety boundary
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('integrations/knowledge/structured-sources.json'))
          by={x['id']:x for x in d['sources']}
          book=by['book-of-secret-knowledge']
          assert 'no-automatic-command-execution' in book['restrictions']
          assert 'authorized-security-use-only' in book['restrictions']
          assert 'no-unverified-mcp-execution' in by['awesome-mcp-servers']['restrictions']
          assert 'anti-bot-bypass-not-default' in by['scrapling']['restrictions']
          for source_id in ['ollama','scrapling','open-design']:
              assert by[source_id]['mode'] == 'executable-capability'
              assert by[source_id]['restrictions']
          PY
