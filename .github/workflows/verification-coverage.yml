name: Verify catalog coverage

on:
  pull_request:
    paths:
      - "catalog/**"
      - "registry/**"
      - "automation/report_verification_coverage.py"
      - "evidence/intensive-verification/PROGRAM.md"
      - ".github/workflows/verification-coverage.yml"
  push:
    paths:
      - "catalog/**"
      - "registry/**"
      - "automation/report_verification_coverage.py"
      - "evidence/intensive-verification/PROGRAM.md"
      - ".github/workflows/verification-coverage.yml"
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate catalog-to-registry mapping
        run: python3 automation/report_verification_coverage.py --check --output verification-coverage.json
      - name: Publish verification coverage
        uses: actions/upload-artifact@v4
        with:
          name: verification-coverage
          path: verification-coverage.json
