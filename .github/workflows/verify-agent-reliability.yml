name: Verify Agent Reliability

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Agent Reliability tests
        run: python3 -m unittest tests.test_agent_reliability -v
      - name: Verify policy and benchmark contracts
        run: |
          python3 - <<'PY'
          import json
          b=json.load(open('integrations/reliability/benchmarks.json'))
          p=json.load(open('integrations/reliability/reliability-policy.json'))
          assert b['version'] == '0.5.0'
          assert len(b['scenarios']) >= 8
          assert set(p['statuses']) == {'PASS','FAIL','HUMAN_REVIEW'}
          assert 'fabricated_verification' in p['hard_failures']
          assert 'production_deployment' in p['human_review_triggers']
          PY
      - name: Verify packaged CLI
        run: |
          python3 -m pip install .
          internet-well-reliability scenarios > /tmp/scenarios.json
          internet-well-reliability trace-new 'reliability smoke test' > /tmp/trace.json
          python3 - <<'PY'
          import json
          scenarios=json.load(open('/tmp/scenarios.json'))
          trace=json.load(open('/tmp/trace.json'))
          assert len(scenarios['scenarios']) >= 8
          assert trace['final_state'] == 'running'
          assert trace['trace_id']
          PY
      - name: Prove self-report cannot bypass gate
        run: |
          cat > /tmp/run.json <<'JSON'
          {"agent_status":"done","criteria":{},"evidence":["self-report"],"metrics":{}}
          JSON
          internet-well-reliability verify production-code-change /tmp/run.json > /tmp/verdict.json
          python3 - <<'PY'
          import json
          verdict=json.load(open('/tmp/verdict.json'))
          assert verdict['status'] == 'FAIL'
          assert verdict['missing_criteria']
          PY
