[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "internet-well"
version = "0.3.0"
description = "Privacy-first, evidence-backed Founder OS for local repository assessment and governed implementation planning."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Internet-Well contributors"}]
keywords = ["founder-os", "software-assessment", "security", "privacy", "ai-governance", "open-source"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/ayo-lgtm/Internet-Well"
Repository = "https://github.com/ayo-lgtm/Internet-Well"
Issues = "https://github.com/ayo-lgtm/Internet-Well/issues"

[project.scripts]
internet-well = "internet_well:main"
internet-well-integrations = "automation.vibe_integrations:main"
internet-well-ponytail = "automation.ponytail_integration:main"
internet-well-screenshot-integrations = "automation.screenshot_integrations:main"
internet-well-apple-design = "automation.apple_design_integration:main"
internet-well-agent-systems = "automation.agent_system_integrations:main"

[tool.setuptools]
py-modules = ["internet_well"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["automation*"]

[tool.setuptools.data-files]
"integrations/vibe" = ["integrations/vibe/manifest.json", "integrations/vibe/ponytail.json", "integrations/vibe/screenshot-resources.json", "integrations/vibe/apple-design-skills.json"]
"integrations/agent-systems" = ["integrations/agent-systems/wassim-agent-systems.json"]
