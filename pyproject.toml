[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "internet-well"
version = "0.4.0"
description = "Privacy-first, evidence-backed Founder OS and governed Agent Brain with structured discovery, reliability evaluation, trajectory tracing, and supervised automation."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "Internet-Well contributors"}]
keywords = ["founder-os", "agent-brain", "agent-evals", "tracing", "mcp", "capability-graph", "software-assessment", "security", "privacy", "ai-governance", "open-source"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/ayo-lgtm/Internet-Well"
Repository = "https://github.com/ayo-lgtm/Internet-Well"
Issues = "https://github.com/ayo-lgtm/Internet-Well/issues"

[project.scripts]
internet-well = "internet_well:main"
internet-well-integrations = "automation.vibe_integrations:main"
internet-well-ponytail = "automation.ponytail_integration:main"
internet-well-screenshot-integrations = "automation.screenshot_integrations:main"
internet-well-apple-design = "automation.apple_design_integration:main"
internet-well-agent-systems = "automation.agent_system_integrations:main"
internet-well-api-discovery = "automation.api_discovery:main"
internet-well-brain = "automation.agent_brain:main"
internet-well-upstreams = "automation.upstream_verifier:main"
internet-well-compliance = "automation.probo_compliance:main"
internet-well-knowledge = "automation.knowledge_discovery:main"
internet-well-reliability = "automation.agent_reliability:main"

[tool.setuptools]
py-modules = ["internet_well"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["automation*"]

[tool.setuptools.data-files]
"integrations/vibe" = ["integrations/vibe/manifest.json", "integrations/vibe/ponytail.json", "integrations/vibe/screenshot-resources.json", "integrations/vibe/apple-design-skills.json"]
"integrations/agent-systems" = ["integrations/agent-systems/wassim-agent-systems.json"]
"integrations/api-discovery" = ["integrations/api-discovery/public-apis.json"]
"integrations/compliance" = ["integrations/compliance/probo.json"]
"integrations/knowledge" = ["integrations/knowledge/structured-sources.json"]
"integrations/reliability" = ["integrations/reliability/benchmarks.json", "integrations/reliability/reliability-policy.json", "integrations/reliability/production-agent-sources.json"]
"integrations/agent-brain" = ["integrations/agent-brain/capability-graph.json", "integrations/agent-brain/mcp.json"]
"bundles" = ["bundles/agent-brain-bundles.json"]
